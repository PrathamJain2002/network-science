version: '3.8'

services:
  translate-ai:
    build: .
    ports:
      - "3000:3000"  # Node.js frontend
      - "8000:8000"  # FastAPI backend
    environment:
      - NODE_ENV=production
      - PYTHONPATH=/app
    volumes:
      - ./uploads:/app/uploads
      - ./output:/app/output
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add Redis for job queue management
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    volumes:
      - redis_data:/data

volumes:
  redis_data:
