services:
  # Backend Service
  - type: web
    name: translate-ai-backend
    env: python
    buildCommand: pip install -r requirements-minimal.txt
    startCommand: python -m uvicorn api:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS_JSON
        sync: false
      - key: JWT_SECRET_KEY
        sync: false

  # Frontend Service
  - type: web
    name: translate-ai-frontend
    env: node
    buildCommand: npm install
    startCommand: node server.js
    envVars:
      - key: API_BASE_URL
        fromService:
          type: web
          name: translate-ai-backend
          property: host
